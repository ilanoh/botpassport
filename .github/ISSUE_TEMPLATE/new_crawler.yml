name: New crawler list
description: Propose a crawler whose operator publishes its IP addresses
labels: [new-crawler]
body:
  - type: input
    id: operator
    attributes:
      label: Operator
      placeholder: Example AI
    validations:
      required: true
  - type: input
    id: user_agents
    attributes:
      label: User agents
      placeholder: ExampleBot, Example-User
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Operator documentation page
      description: The operator's own page that names the list.
    validations:
      required: true
  - type: input
    id: list
    attributes:
      label: URL of the published address list
    validations:
      required: true
