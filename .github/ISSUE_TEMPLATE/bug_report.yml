name: Bug report
description: A wrong address, a failed list or a command that misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it printed, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: botpassport and Node.js versions
      placeholder: botpassport 0.1.0, Node.js 22.12
