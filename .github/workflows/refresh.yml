# Fetches every published crawler list each day and commits dist/ when one changed. The snapshot holds no fetch
# time, so an unchanged day makes no commit.
name: refresh

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-dist.js
      - name: Commit the lists that changed
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "no list changed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "dist: the published crawler lists of $(date -u +%F)"
          git push
